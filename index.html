<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LogiSheet Sync - Logistics Log Manager</title>
  
  <!-- Modern Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons for premium visual cues -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- CSS Link -->
  
  <!-- SheetJS Library for Excel operations -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  
  <script type="module" crossorigin src="/sagar-app/assets/index-BZ5vb2vK.js"></script>
  <link rel="stylesheet" crossorigin href="/sagar-app/assets/index-CnleVaju.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-logo">
        <div class="logo-icon">
          <i data-lucide="truck"></i>
        </div>
        <div>
          <h1>LogiSheet Sync</h1>
          <p class="subtitle">Mobile-first logistics logs</p>
        </div>
      </div>
      
    </header>

    <main class="app-content">
      <!-- Unified Actions Toolbar Card -->
      <section class="card toolbar-card hidden" id="toolbar-card">
        <div class="toolbar-content">
          <!-- File Import / Status Area -->
          <div class="toolbar-file-area">
            <div class="file-dropzone" id="file-dropzone">
              <i data-lucide="upload-cloud"></i>
              <span>Upload Excel</span>
              <input type="file" id="file-input" accept=".xlsx, .xls" class="hidden-input">
            </div>
            
            <div id="file-details" class="file-details-compact hidden">
              <div class="compact-file-info">
                <i data-lucide="file-spreadsheet" class="success-icon"></i>
                <div class="file-text-wrapper">
                  <span class="file-name" id="loaded-file-name">logistics_log.xlsx</span>
                  <span class="file-size" id="loaded-file-size">0 KB</span>
                </div>
              </div>
              <button id="btn-reset-file" class="reset-file-btn" title="Remove workbook">
                <i data-lucide="x"></i>
              </button>
            </div>
          </div>

          <!-- Operation Actions Area -->
          <div class="toolbar-actions-area">
            <button type="button" id="btn-open-add-modal" class="btn btn-primary">
              <i data-lucide="plus"></i> Add Entry
            </button>
            <button type="button" id="btn-open-summary-modal" class="btn btn-secondary">
              <i data-lucide="calculator"></i> View Summary
            </button>
            <button type="button" id="btn-download" class="btn btn-secondary">
              <i data-lucide="download"></i> Download Excel
            </button>
          </div>
        </div>
      </section>

      <!-- Empty State Dashboard -->
      <div class="dashboard-empty-state" id="dashboard-empty-state">
        <i data-lucide="file-spreadsheet" class="empty-icon"></i>
        <h3>No logs preview</h3>
        <p>Import an Excel file or tap <strong>Add Entry</strong> to start recording transactions.</p>
      </div>

      <!-- Data Preview Section -->
      <section class="card preview-card hidden" id="preview-card">



        <!-- Mobile Card-based view (rendered dynamically for small screens) -->
        <div class="mobile-cards-container" id="mobile-cards-container">
          <!-- Populated dynamically via JS -->
        </div>
      </section>
    </main>



    <!-- Add Entry Modal -->
    <div class="modal-backdrop hidden" id="add-entry-modal">
      <div class="modal-content card">
        <div class="modal-header">
          <h2>Add Logistics Entry</h2>
          <button class="icon-button btn-close-modal" id="btn-close-add-modal">
            <i data-lucide="x"></i>
          </button>
        </div>
        
        <form id="entry-form" class="entry-form">
          <div class="modal-body">
            <div class="form-grid" style="grid-template-columns: 1fr; gap: 16px;">
              <!-- Date Field -->
              <div class="form-group">
                <label for="input-date">Date</label>
                <div class="input-wrapper">
                  <i data-lucide="calendar" class="input-icon"></i>
                  <input type="date" id="input-date" required>
                </div>
              </div>

              <!-- Challan No -->
              <div class="form-group">
                <label for="input-challan-no">Challan No</label>
                <div class="input-wrapper">
                  <i data-lucide="file-text" class="input-icon"></i>
                  <input type="text" id="input-challan-no" placeholder="Max 12 characters" maxlength="12">
                </div>
              </div>

              <!-- Gate No -->
              <div class="form-group">
                <label for="input-gate-no">Gate No</label>
                <div class="input-wrapper">
                  <i data-lucide="hash" class="input-icon"></i>
                  <input type="text" id="input-gate-no" placeholder="Max 4 characters" maxlength="4">
                </div>
              </div>

              <!-- Loading Location -->
              <div class="form-group">
                <label for="select-loading">Loading Location</label>
                <div class="input-wrapper">
                  <i data-lucide="map-pin" class="input-icon"></i>
                  <select id="select-loading" required>
                    <!-- Will be populated dynamically -->
                  </select>
                </div>
              </div>

              <!-- Unloading Location -->
              <div class="form-group">
                <label for="select-unloading">Unloading Location</label>
                <div class="input-wrapper">
                  <i data-lucide="navigation" class="input-icon"></i>
                  <select id="select-unloading" required>
                    <!-- Will be populated dynamically -->
                  </select>
                </div>
              </div>

              <!-- Weight in Kilo -->
              <div class="form-group">
                <label for="input-weight">Weight (Kilo)</label>
                <div class="input-wrapper">
                  <i data-lucide="scale" class="input-icon"></i>
                  <input type="number" id="input-weight" placeholder="0" step="1" min="0" required>
                </div>
              </div>

              <!-- Rate -->
              <div class="form-group">
                <label for="input-rate">Rate</label>
                <div class="input-wrapper">
                  <i data-lucide="dollar-sign" class="input-icon"></i>
                  <input type="number" id="input-rate" placeholder="0.00" step="0.01" min="0" required>
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer" style="margin-top: 20px;">
            <button type="button" class="btn btn-secondary" id="btn-cancel-add-modal">Cancel</button>
            <button type="submit" id="btn-add-entry" class="btn btn-primary">Add Entry</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Summary Modal -->
    <div class="modal-backdrop hidden" id="summary-modal">
      <div class="modal-content card">
        <div class="modal-header">
          <div style="display: flex; align-items: center; gap: 10px;">
            <i data-lucide="calculator" class="card-header-icon" style="color: var(--accent); width: 20px; height: 20px;"></i>
            <h2>Sheet Summary</h2>
          </div>
          <button class="icon-button btn-close-modal" id="btn-close-summary-modal">
            <i data-lucide="x"></i>
          </button>
        </div>
        
        <div class="modal-body">
          <div class="summary-content">
            <div class="form-grid" style="grid-template-columns: 1fr; margin-bottom: 16px;">
              <!-- Global Margin % Field -->
              <div class="form-group">
                <label for="input-global-margin">Global Margin %</label>
                <div class="input-wrapper">
                  <i data-lucide="percent" class="input-icon"></i>
                  <input type="number" id="input-global-margin" value="0.0" step="0.1" min="0" max="100">
                </div>
              </div>
            </div>

            <div class="summary-metrics">
              <div class="metric-row">
                <span class="metric-label">Total Weight:</span>
                <span class="metric-value" id="summary-total-weight">0 kg</span>
              </div>
              <div class="metric-row">
                <span class="metric-label">Total Rate (Sum of Rates):</span>
                <span class="metric-value" id="summary-total-rate">₹ 0.00</span>
              </div>
              <div class="metric-row highlighted">
                <span class="metric-label">Net Payment (After Margin):</span>
                <span class="metric-value" id="summary-net-payment">₹ 0.00</span>
              </div>
            </div>
          </div>
        </div>
        
        <div class="modal-footer" style="margin-top: 20px;">
          <button type="button" class="btn btn-primary" id="btn-close-summary-modal-ok">OK</button>
        </div>
      </div>
    </div>

    <!-- Sticky Mobile Bottom Bar -->
    <div class="mobile-bottom-bar" id="mobile-bottom-bar">
      <button type="button" class="bottom-bar-item" id="mobile-btn-upload" title="Upload Excel">
        <i data-lucide="upload"></i>
        <span>Upload</span>
      </button>
      <button type="button" class="bottom-bar-item" id="mobile-btn-open-add-modal" title="Add Entry">
        <i data-lucide="plus"></i>
        <span>Add Entry</span>
      </button>
      <button type="button" class="bottom-bar-item" id="mobile-btn-open-summary-modal" title="View Summary">
        <i data-lucide="calculator"></i>
        <span>Summary</span>
      </button>
      <button type="button" class="bottom-bar-item" id="mobile-btn-download" title="Download Excel">
        <i data-lucide="download"></i>
        <span>Download</span>
      </button>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container" class="toast-container"></div>
  </div>

</body>
</html>
